<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>북입스 표지 만들기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @font-face { font-family:"Eulyoo1945-SemiBold"; src:url("Eulyoo1945-SemiBold.otf") format("opentype"); }
  @font-face { font-family:"Pretendard-SemiBold"; src:url("Pretendard-SemiBold.otf") format("opentype"); }
  @font-face { font-family:"Pretendard-Bold"; src:url("Pretendard-Bold.otf") format("opentype"); }
  @font-face { font-family:"Pretendard-Medium"; src:url("Pretendard-Medium.otf") format("opentype"); }
  @font-face { font-family:"HakgyoansimRikodeoOTFR"; src:url("HakgyoansimRikodeoOTFR.otf") format("opentype"); }
  @font-face { font-family:"HSHwalkongSerif-Regular"; src:url("HSHwalkongSerif-Regular.otf") format("opentype"); }
  @font-face { font-family:"RiaSans-Bold"; src:url("RiaSans-Bold.otf") format("opentype"); }
  @font-face { font-family:"RiaSans-ExtraBold"; src:url("RiaSans-ExtraBold.otf") format("opentype"); }

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Pretendard-SemiBold", sans-serif; background:#f4f3ef; color:#2b2b2b; }
  header { padding:18px 28px; background:#fff; border-bottom:1px solid #e5e2da; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:20px; }
  header .sub { color:#8a8576; font-size:13px; font-weight:normal; }
  .wrap { display:flex; gap:24px; padding:24px 28px; align-items:flex-start; max-width:1500px; margin:0 auto; }

  .panel { background:#fff; border:1px solid #e5e2da; border-radius:14px; padding:22px; }
  .left { width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:20px; }
  .left h2 { font-size:14px; color:#6b665a; margin-bottom:10px; }

  .tpl-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .tpl { border:2.5px solid transparent; border-radius:10px; overflow:hidden; cursor:pointer; position:relative; transition:transform .12s; background:#eee; }
  .tpl img { width:100%; display:block; aspect-ratio:595/842; object-fit:cover; }
  .tpl:hover { transform:translateY(-2px); }
  .tpl.sel { border-color:#507aa5; box-shadow:0 0 0 2px rgba(80,122,165,.25); }
  .tpl .no { position:absolute; top:5px; left:5px; background:rgba(255,255,255,.92); border-radius:6px; font-size:11px; padding:2px 7px; }

  label { display:block; font-size:13px; color:#6b665a; margin:14px 0 6px; }
  input[type=text] { width:100%; padding:11px 13px; border:1.5px solid #ddd9cf; border-radius:9px; font-size:15px; font-family:inherit; }
  input[type=text]:focus { outline:none; border-color:#507aa5; }

  .btn { width:100%; padding:14px; border:none; border-radius:10px; background:#507aa5; color:#fff; font-size:16px; font-family:inherit; cursor:pointer; margin-top:18px; }
  .btn:hover { background:#3f6691; }
  .btn:disabled { background:#b8c5d2; cursor:wait; }
  .hint { font-size:12px; color:#9a958a; margin-top:8px; line-height:1.5; }

  .right { flex:1; display:flex; gap:20px; flex-wrap:wrap; }
  .preview { flex:1; min-width:300px; }
  .preview h3 { font-size:14px; color:#6b665a; margin-bottom:10px; text-align:center; }
  canvas { width:100%; display:block; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.12); background:#fff; }
</style>
</head>
<body>
<header>
  <h1>📚 북입스 표지 만들기</h1>
  <span class="sub">표지 디자인 선택 → 내용 입력 → PDF 저장</span>
</header>

<div class="wrap">
  <div class="panel left">
    <div>
      <h2>1. 표지 디자인 선택</h2>
      <div class="tpl-grid" id="tplGrid"></div>
    </div>
    <div>
      <h2>2. 내용 입력</h2>
      <label>교재명 윗줄</label>
      <input type="text" id="inBook" placeholder="예: 중등 수학 심화" value="">
      <label>교재명 아랫줄 (한 줄이면 비워두세요)</label>
      <input type="text" id="inBook2" placeholder="예: 문제집 상권" value="">
      <label>학원명</label>
      <input type="text" id="inAcademy" placeholder="예: 강서해밀영재학원" value="">
      <label>학원 전화번호</label>
      <input type="text" id="inPhone" placeholder="예: 02-1234-5678" value="">
      <button class="btn" id="btnPdf">📄 PDF로 저장 (앞면+뒷면)</button>
      <p class="hint">비워둔 칸은 표지에서 그대로 비워져요.<br>PDF는 인쇄용 고화질(A4 2쪽)로 저장됩니다.</p>
    </div>
  </div>

  <div class="right">
    <div class="preview"><h3>앞면 (1쪽)</h3><canvas id="cvFront"></canvas></div>
    <div class="preview"><h3>뒷면 (2쪽)</h3><canvas id="cvBack"></canvas></div>
  </div>
</div>

<script>
const A4W = 595.276, A4H = 841.89;
const SLOTS = {"1": {"name": "Template-01", "page2": {"교재명": {"x": 285.4, "y": 289.0, "max_width": 384.4, "font": "Eulyoo1945-SemiBold", "size": 20.0, "color": "#507aa5", "align": "center", "max_lines": 2, "line_height": 1.4}}, "page1": {"교재명": {"x": 315.2, "y": 164.4, "max_width": 460.0, "font": "Eulyoo1945-SemiBold", "size": 40.0, "color": "#507aa5", "align": "center", "max_lines": 2, "line_height": 1.375}, "학원명": {"x": 104.9, "y": 775.8, "max_width": 280.0, "font": "Pretendard-Bold", "size": 20.0, "color": "#537ead", "align": "left", "max_lines": 1, "line_height": 1.3}, "전화번호": {"x": 528.9, "y": 775.2, "max_width": 150.0, "font": "Pretendard-Medium", "size": 18.0, "color": "#537ead", "align": "right", "max_lines": 1, "line_height": 1.3}}}, "2": {"name": "Template-02", "page2": {"교재명": {"x": 275.0, "y": 310.0, "max_width": 411.5, "font": "Eulyoo1945-SemiBold", "size": 20.0, "color": "#040000", "align": "center", "max_lines": 2, "line_height": 1.45}}, "page1": {"교재명": {"x": 316.8, "y": 164.4, "max_width": 460.0, "font": "Eulyoo1945-SemiBold", "size": 40.0, "color": "#040000", "align": "center", "max_lines": 2, "line_height": 1.375}, "학원명": {"x": 94.8, "y": 337.3, "max_width": 300.0, "font": "Pretendard-Bold", "size": 22.0, "color": "#878b91", "align": "left", "max_lines": 1, "line_height": 1.3}, "전화번호": {"x": 537.0, "y": 336.2, "max_width": 150.0, "font": "Pretendard-Medium", "size": 18.0, "color": "#888d92", "align": "right", "max_lines": 1, "line_height": 1.3}}}, "3": {"name": "Template-03", "page1": {"교재명": {"x": 283.3, "y": 194.0, "max_width": 460.0, "font": "HakgyoansimRikodeoOTFR", "size": 39.7, "color": "#fcebd9", "align": "center", "max_lines": 2, "line_height": 1.375}, "학원명": {"x": 104.9, "y": 775.8, "max_width": 280.0, "font": "Pretendard-Bold", "size": 20.0, "color": "#fcebd9", "align": "left", "max_lines": 1, "line_height": 1.3}, "전화번호": {"x": 528.9, "y": 775.2, "max_width": 150.0, "font": "Pretendard-Medium", "size": 18.0, "color": "#fcebd9", "align": "right", "max_lines": 1, "line_height": 1.3}}, "page2": {"교재명": {"x": 283.3, "y": 289.0, "max_width": 384.0, "font": "HakgyoansimRikodeoOTFR", "size": 20.0, "color": "#fcebd9", "align": "center", "max_lines": 2, "line_height": 1.4}}}, "4": {"name": "Template-04", "page2": {"교재명": {"x": "center", "y": 321.8, "max_width": 411.5, "font": "Eulyoo1945-SemiBold", "size": 22.1, "color": "#1f6da6", "align": "center", "max_lines": 2, "line_height": 1.3}}, "page1": {"교재명": {"x": 75.6, "y": 223.9, "max_width": 469.8, "font": "Eulyoo1945-SemiBold", "size": 39.7, "color": "#1f6da6", "align": "left", "max_lines": 2, "line_height": 1.3}, "학원명": {"x": 82.6, "y": 493.1, "max_width": 250.0, "font": "Pretendard-SemiBold", "size": 23.2, "color": "#1f6da6", "align": "left", "max_lines": 1, "line_height": 1.3}, "전화번호": {"x": 159.5, "y": 522.8, "max_width": 160.0, "font": "Pretendard-SemiBold", "size": 17.7, "color": "#1f6da6", "align": "center", "max_lines": 1, "line_height": 1.3}}}, "5": {"name": "Template-05", "page2": {"교재명": {"x": "center", "y": 340.5, "max_width": 411.5, "font": "HSHwalkongSerif-Regular", "size": 22.1, "color": "#ffffff", "align": "center", "max_lines": 2, "line_height": 1.3}}, "page1": {"교재명": {"x": "center", "y": 275.2, "max_width": 469.8, "font": "HSHwalkongSerif-Regular", "size": 48.5, "color": "#ffffff", "align": "center", "max_lines": 2, "line_height": 1.3}, "학원명": {"x": 86.1, "y": 575.1, "max_width": 250.0, "font": "Pretendard-SemiBold", "size": 23.2, "color": "#ffffff", "align": "left", "max_lines": 1, "line_height": 1.3}, "전화번호": {"x": 165.5, "y": 607.3, "max_width": 180.0, "font": "Pretendard-SemiBold", "size": 17.7, "color": "#ffffff", "align": "center", "max_lines": 1, "line_height": 1.3}}}, "6": {"name": "Template-06", "page2": {"교재명": {"x": "center", "y": 327.1, "max_width": 411.5, "font": "RiaSans-Bold", "size": 17.7, "color": "#ffffff", "align": "center", "max_lines": 2, "line_height": 1.3}}, "page1": {"교재명": {"x": 81.2, "y": 148.1, "max_width": 458.3, "font": "RiaSans-ExtraBold", "size": 39.7, "color": "#ffffff", "align": "left", "max_lines": 2, "line_height": 1.3}, "학원명": {"x": 82.2, "y": 791.3, "max_width": 300.0, "font": "Pretendard-SemiBold", "size": 17.7, "color": "#ffffff", "align": "left", "max_lines": 1, "line_height": 1.3}, "전화번호": {"x": 539.2, "y": 791.3, "max_width": 113.4, "font": "Pretendard-SemiBold", "size": 17.7, "color": "#ffffff", "align": "right", "max_lines": 1, "line_height": 1.3}}}};

const state = { tpl: 1 };
const imgs = {};  // "t1_p1" -> Image

function loadImg(key, src){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ imgs[key]=im; res(); };
    im.onerror = ()=>res();
    im.src = src;
  });
}

function measure(ctx, text, fontFam, sizePx){
  ctx.font = sizePx + "px \"" + fontFam + "\"";
  return ctx.measureText(text).width;
}

// generate_covers.py 의 fit_text 와 동일한 규칙
function fitText(ctx, text, fontFam, baseSize, maxWidth, maxLines){
  text = (text||"").trim();
  if(!text) return {lines:[], size:baseSize};
  if(measure(ctx,text,fontFam,baseSize) <= maxWidth) return {lines:[text], size:baseSize};
  const trySplit = (sz)=>{
    const words = text.split(" ");
    if(words.length >= 2){
      let best=null, bd=Infinity;
      for(let i=1;i<words.length;i++){
        const l1=words.slice(0,i).join(" "), l2=words.slice(i).join(" ");
        const w1=measure(ctx,l1,fontFam,sz), w2=measure(ctx,l2,fontFam,sz);
        if(w1<=maxWidth && w2<=maxWidth && Math.abs(w1-w2)<bd){ bd=Math.abs(w1-w2); best=[l1,l2]; }
      }
      return best;
    } else {
      const mid = Math.floor(text.length/2);
      const l1=text.slice(0,mid), l2=text.slice(mid);
      if(measure(ctx,l1,fontFam,sz)<=maxWidth && measure(ctx,l2,fontFam,sz)<=maxWidth) return [l1,l2];
      return null;
    }
  };
  if(maxLines>=2){ const sp=trySplit(baseSize); if(sp) return {lines:sp, size:baseSize}; }
  for(const sh of [0.95,0.9,0.85,0.8,0.75,0.7,0.65,0.6]){
    const sz = baseSize*sh;
    if(measure(ctx,text,fontFam,sz)<=maxWidth) return {lines:[text], size:sz};
    if(maxLines>=2){ const sp=trySplit(sz); if(sp) return {lines:sp, size:sz}; }
  }
  const sz = baseSize*0.6;
  let t = text;
  while(t && measure(ctx,t+"...",fontFam,sz) > maxWidth) t = t.slice(0,-1);
  return {lines:[t+"..."], size:sz};
}

function drawCover(canvas, tplNo, pageKey, data, scale){
  const W = Math.round(A4W*scale), H = Math.round(A4H*scale);
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const bg = imgs["t"+tplNo+"_"+(pageKey==="page1"?"p1":"p2")];
  if(bg) ctx.drawImage(bg, 0, 0, W, H); else { ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); }

  const cfg = SLOTS[String(tplNo)][pageKey];
  if(!cfg) return;
  const dmap = { "교재명":data.book, "학원명":data.academy, "전화번호":data.phone };
  ctx.textBaseline = "alphabetic";
  for(const [name, sc] of Object.entries(cfg)){
    const baseSize = sc.size*scale, mw = sc.max_width*scale;
    let lines, size;
    if(name === "교재명"){
      const manual = [ (data.book||"").trim(), (data.book2||"").trim() ].filter(Boolean);
      if(!manual.length) continue;
      size = baseSize;
      for(const sh of [1,0.95,0.9,0.85,0.8,0.75,0.7,0.65,0.6]){
        size = baseSize*sh;
        if(manual.every(l => measure(ctx,l,sc.font,size) <= mw)) break;
      }
      lines = manual;
    } else {
      const val = (dmap[name]||"").trim();
      if(!val) continue;
      const r = fitText(ctx, val, sc.font, baseSize, mw, sc.max_lines||2);
      lines = r.lines; size = r.size;
    }
    ctx.fillStyle = sc.color;
    lines.forEach((line,i)=>{
      ctx.font = size + "px \"" + sc.font + "\"";
      const lw = ctx.measureText(line).width;
      const y = sc.y*scale + i*size*(sc.line_height||1.3);
      let x;
      if(sc.x === "center") x = (W-lw)/2;
      else if(sc.align === "right") x = sc.x*scale - lw;
      else if(sc.align === "center") x = sc.x*scale - lw/2;
      else x = sc.x*scale;
      ctx.fillText(line, x, y);
    });
  }
}

function getData(){
  return {
    book: document.getElementById("inBook").value,
    book2: document.getElementById("inBook2").value,
    academy: document.getElementById("inAcademy").value,
    phone: document.getElementById("inPhone").value
  };
}

function render(){
  const d = getData();
  drawCover(document.getElementById("cvFront"), state.tpl, "page1", d, 1.6);
  drawCover(document.getElementById("cvBack"),  state.tpl, "page2", d, 1.6);
}

function sanitize(s){ return (s||"").replace(/[<>:"/\\|?*\n\r\t]/g,"_").replace(/\s+/g," ").trim(); }

async function savePdf(){
  const btn = document.getElementById("btnPdf");
  btn.disabled = true; btn.textContent = "만드는 중...";
  try{
    const d = getData();
    const S = 4; // 고화질
    const c1 = document.createElement("canvas"), c2 = document.createElement("canvas");
    drawCover(c1, state.tpl, "page1", d, S);
    drawCover(c2, state.tpl, "page2", d, S);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"pt", format:[A4W,A4H]});
    pdf.addImage(c1.toDataURL("image/jpeg",0.93), "JPEG", 0, 0, A4W, A4H);
    pdf.addPage([A4W,A4H]);
    pdf.addImage(c2.toDataURL("image/jpeg",0.93), "JPEG", 0, 0, A4W, A4H);
    const parts = ["표지", state.tpl+"번", sanitize((d.book+" "+(d.book2||"")).trim()), sanitize(d.academy)].filter(Boolean);
    pdf.save(parts.join("_") + ".pdf");
  }catch(e){
    alert("PDF 저장에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.\n(" + e.message + ")");
  }finally{
    btn.disabled = false; btn.textContent = "📄 PDF로 저장 (앞면+뒷면)";
  }
}

async function init(){
  // 템플릿 선택 버튼
  const grid = document.getElementById("tplGrid");
  for(let t=1;t<=6;t++){
    const div = document.createElement("div");
    div.className = "tpl" + (t===1?" sel":"");
    div.innerHTML = "<span class='no'>"+t+"번</span><img src='t"+t+"_p1.jpg' alt='표지 "+t+"번'>";
    div.onclick = ()=>{
      state.tpl = t;
      document.querySelectorAll(".tpl").forEach(e=>e.classList.remove("sel"));
      div.classList.add("sel");
      render();
    };
    grid.appendChild(div);
  }
  // 이미지 + 폰트 로딩 후 첫 렌더
  const jobs = [];
  for(let t=1;t<=6;t++){ jobs.push(loadImg("t"+t+"_p1","t"+t+"_p1.jpg")); jobs.push(loadImg("t"+t+"_p2","t"+t+"_p2.jpg")); }
  const fams = ["Eulyoo1945-SemiBold","Pretendard-SemiBold","Pretendard-Bold","Pretendard-Medium","HakgyoansimRikodeoOTFR","HSHwalkongSerif-Regular","RiaSans-Bold","RiaSans-ExtraBold"];
  fams.forEach(f=>jobs.push(document.fonts.load("20px \""+f+"\"").catch(()=>{})));
  await Promise.all(jobs);
  await document.fonts.ready;
  ["inBook","inBook2","inAcademy","inPhone"].forEach(id=>document.getElementById(id).addEventListener("input", render));
  document.getElementById("btnPdf").addEventListener("click", savePdf);
  render();
}
init();
</script>
</body>
</html>
